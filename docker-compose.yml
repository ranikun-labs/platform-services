name: ranikun-platform

services:
  gateway-app:
    image: ${PLATFORM_GATEWAY_IMAGE:-ranikunlabs/platform-gateway:local}
    build:
      context: ./gateway-app
    environment:
      PLATFORM_GATEWAY_PORT: ${PLATFORM_GATEWAY_PORT:-8080}
      PLATFORM_GATEWAY_REDIS_HOST: redis
      PLATFORM_GATEWAY_REDIS_PORT: 6379
      PLATFORM_GATEWAY_REDIS_KEY_PREFIX: "platform:gateway:"
      # Dark default: keep auth on Carelog until the live Platform Identity gate passes.
      PLATFORM_GATEWAY_AUTH_URI: ${PLATFORM_GATEWAY_AUTH_URI:-${PLATFORM_GATEWAY_CARELOG_BE_URI}}
      PLATFORM_GATEWAY_CARELOG_BE_URI: ${PLATFORM_GATEWAY_CARELOG_BE_URI:?PLATFORM_GATEWAY_CARELOG_BE_URI must be set}
      PLATFORM_GATEWAY_CARELOG_RAG_URI: ${PLATFORM_GATEWAY_CARELOG_RAG_URI:?PLATFORM_GATEWAY_CARELOG_RAG_URI must be set}
      PLATFORM_GATEWAY_JWT_VERIFICATION_SECRET: ${PLATFORM_GATEWAY_JWT_VERIFICATION_SECRET:?PLATFORM_GATEWAY_JWT_VERIFICATION_SECRET must be set}
      PLATFORM_GATEWAY_INTERNAL_SECRET: ${PLATFORM_GATEWAY_INTERNAL_SECRET:?PLATFORM_GATEWAY_INTERNAL_SECRET must be set}
    ports:
      - "${PLATFORM_GATEWAY_PUBLISHED_PORT:-8080}:${PLATFORM_GATEWAY_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${PLATFORM_GATEWAY_PORT}/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - platform

  platform-core-app:
    image: ${PLATFORM_CORE_IMAGE:-ranikunlabs/platform-core:local}
    build:
      context: ./platform-core
      dockerfile: app/Dockerfile
    environment:
      PLATFORM_CORE_PORT: ${PLATFORM_CORE_PORT:-8081}
      PLATFORM_IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PLATFORM_POSTGRES_DB:-platform}
      PLATFORM_IDENTITY_DATASOURCE_USERNAME: ${PLATFORM_POSTGRES_USER:-platform}
      PLATFORM_IDENTITY_DATASOURCE_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?PLATFORM_POSTGRES_PASSWORD must be set}
      PLATFORM_IDENTITY_REDIS_HOST: redis
      PLATFORM_IDENTITY_REDIS_PORT: 6379
      PLATFORM_IDENTITY_REDIS_KEY_PREFIX: "platform:identity:"
      PLATFORM_IDENTITY_AUTH_ENABLED: ${PLATFORM_IDENTITY_AUTH_ENABLED:-false}
      PLATFORM_IDENTITY_PRODUCT_CLAIMS_ENABLED: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_ENABLED:-false}
      PLATFORM_IDENTITY_PRODUCT_CLAIMS_BASE_URL: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_BASE_URL:-}
      PLATFORM_IDENTITY_PRODUCT_CLAIMS_SERVICE_SECRET: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_SERVICE_SECRET:-}
      PLATFORM_IDENTITY_JWT_SECRET_KEY: ${PLATFORM_IDENTITY_JWT_SECRET_KEY:-}
      PLATFORM_IDENTITY_JWT_ACCESS_TOKEN_VALIDITY: ${PLATFORM_IDENTITY_JWT_ACCESS_TOKEN_VALIDITY:-}
      PLATFORM_IDENTITY_JWT_REFRESH_TOKEN_VALIDITY: ${PLATFORM_IDENTITY_JWT_REFRESH_TOKEN_VALIDITY:-}
      PLATFORM_IDENTITY_KAKAO_CLIENT_ID: ${PLATFORM_IDENTITY_KAKAO_CLIENT_ID:-}
      PLATFORM_IDENTITY_KAKAO_CLIENT_SECRET: ${PLATFORM_IDENTITY_KAKAO_CLIENT_SECRET:-}
      PLATFORM_IDENTITY_KAKAO_AUTHORIZATION_URI: ${PLATFORM_IDENTITY_KAKAO_AUTHORIZATION_URI:-}
      PLATFORM_IDENTITY_KAKAO_TOKEN_URI: ${PLATFORM_IDENTITY_KAKAO_TOKEN_URI:-}
      PLATFORM_IDENTITY_KAKAO_USER_INFO_URI: ${PLATFORM_IDENTITY_KAKAO_USER_INFO_URI:-}
      PLATFORM_IDENTITY_OAUTH_KAKAO_WEB_REDIRECT_URI: ${PLATFORM_IDENTITY_OAUTH_KAKAO_WEB_REDIRECT_URI:-}
      PLATFORM_IDENTITY_OAUTH_KAKAO_MOBILE_REDIRECT_URI: ${PLATFORM_IDENTITY_OAUTH_KAKAO_MOBILE_REDIRECT_URI:-}
      PLATFORM_IDENTITY_OAUTH_ALLOWED_RETURN_ORIGINS: ${PLATFORM_IDENTITY_OAUTH_ALLOWED_RETURN_ORIGINS:-}
    ports:
      - "${PLATFORM_CORE_PUBLISHED_PORT:-8081}:${PLATFORM_CORE_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${PLATFORM_CORE_PORT}/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - platform

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-platform}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?PLATFORM_POSTGRES_PASSWORD must be set}
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform

volumes:
  platform-postgres-data:

networks:
  platform:
    driver: bridge
