spring:
  application:
    name: platform-core-app
  main:
    web-application-type: servlet
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${PLATFORM_CORE_PORT}

platform:
  shared-ai:
    foundation:
      enabled: ${SHARED_AI_FOUNDATION_ENABLED:false}
    openai:
      enabled: ${SHARED_AI_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${SHARED_AI_OPENAI_MODEL:}
      max-output-tokens: ${SHARED_AI_OPENAI_MAX_OUTPUT_TOKENS:128}
      timeout: ${SHARED_AI_OPENAI_TIMEOUT:30s}
  identity:
    datasource:
      url: ${PLATFORM_IDENTITY_DATASOURCE_URL:}
      username: ${PLATFORM_IDENTITY_DATASOURCE_USERNAME:}
      password: ${PLATFORM_IDENTITY_DATASOURCE_PASSWORD:}
    redis-host: ${PLATFORM_IDENTITY_REDIS_HOST:}
    redis-port: ${PLATFORM_IDENTITY_REDIS_PORT}
    redis-key-prefix: ${PLATFORM_IDENTITY_REDIS_KEY_PREFIX:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
