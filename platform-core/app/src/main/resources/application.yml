spring:
  application:
    name: platform-core-app
  datasource:
    type: com.ranikunlabs.platform.identity.adapter.persistence.InstrumentedHikariDataSource
  main:
    web-application-type: servlet

server:
  port: ${PLATFORM_CORE_PORT}

# Auth-only properties remain empty unless the opt-in Identity runtime is enabled.
# The Identity module binds these canonical jwt.*, carelog.auth.oauth.kakao.*, and
# oauth.redirect-uris.* names; no credential or secret default is committed here.
jwt:
  secret-key: ${PLATFORM_IDENTITY_JWT_SECRET_KEY:}
  access-token-validity: ${PLATFORM_IDENTITY_JWT_ACCESS_TOKEN_VALIDITY:}
  refresh-token-validity: ${PLATFORM_IDENTITY_JWT_REFRESH_TOKEN_VALIDITY:}

carelog:
  auth:
    oauth:
      kakao:
        client-id: ${PLATFORM_IDENTITY_KAKAO_CLIENT_ID:}
        client-secret: ${PLATFORM_IDENTITY_KAKAO_CLIENT_SECRET:}
        authorization-uri: ${PLATFORM_IDENTITY_KAKAO_AUTHORIZATION_URI:}
        token-uri: ${PLATFORM_IDENTITY_KAKAO_TOKEN_URI:}
        user-info-uri: ${PLATFORM_IDENTITY_KAKAO_USER_INFO_URI:}

oauth:
  redirect-uris:
    kakao:
      WEB: ${PLATFORM_IDENTITY_OAUTH_KAKAO_WEB_REDIRECT_URI:}
      MOBILE: ${PLATFORM_IDENTITY_OAUTH_KAKAO_MOBILE_REDIRECT_URI:}
  allowed-return-origins: ${PLATFORM_IDENTITY_OAUTH_ALLOWED_RETURN_ORIGINS:}

platform:
  shared-ai:
    foundation:
      enabled: ${SHARED_AI_FOUNDATION_ENABLED:false}
    spring-ai:
      enabled: ${SHARED_AI_SPRING_AI_ENABLED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${SHARED_AI_OPENAI_MODEL:}
      max-output-tokens: ${SHARED_AI_OPENAI_MAX_OUTPUT_TOKENS:128}
      timeout: ${SHARED_AI_OPENAI_TIMEOUT:30s}
  shared-audit:
    enabled: ${SHARED_AUDIT_ENABLED:false}
  identity:
    auth:
      enabled: ${PLATFORM_IDENTITY_AUTH_ENABLED:false}
    # Finance reference (DEV fixture) opt-ins. All default off; signup is DEV-only and must stay false elsewhere.
    # selected-account-ids and jwt.* are env-only (PLATFORM_IDENTITY_FINANCE_REFERENCE_SELECTED_ACCOUNT_IDS,
    # PLATFORM_IDENTITY_FINANCE_REFERENCE_JWT_*); they are bound only when the feature is enabled.
    finance-reference:
      enabled: ${PLATFORM_IDENTITY_FINANCE_REFERENCE_ENABLED:false}
      signup:
        enabled: ${PLATFORM_IDENTITY_FINANCE_REFERENCE_SIGNUP_ENABLED:false}
      # DEV-only: allows Carelog auth coexistence (requires the dev profile) and fixture-free signup admission
      # (zero selected IDs with signup enabled). Rejected under prod profile or production markers.
      dev-dual-auth:
        enabled: ${PLATFORM_IDENTITY_FINANCE_REFERENCE_DEV_DUAL_AUTH_ENABLED:false}
    datasource:
      url: ${PLATFORM_IDENTITY_DATASOURCE_URL:}
      username: ${PLATFORM_IDENTITY_DATASOURCE_USERNAME:}
      password: ${PLATFORM_IDENTITY_DATASOURCE_PASSWORD:}
    flyway-datasource:
      url: ${PLATFORM_IDENTITY_FLYWAY_DATASOURCE_URL:}
      username: ${PLATFORM_IDENTITY_FLYWAY_DATASOURCE_USERNAME:}
      password: ${PLATFORM_IDENTITY_FLYWAY_DATASOURCE_PASSWORD:}
    redis-host: ${PLATFORM_IDENTITY_REDIS_HOST:}
    redis-port: ${PLATFORM_IDENTITY_REDIS_PORT}
    redis-key-prefix: ${PLATFORM_IDENTITY_REDIS_KEY_PREFIX:}
    redis-tls-enabled: ${PLATFORM_IDENTITY_REDIS_TLS_ENABLED:false}
    product-claims:
      enabled: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_ENABLED:false}
      base-url: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_BASE_URL:}
      service-secret: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_SERVICE_SECRET:}
      connect-timeout: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_CONNECT_TIMEOUT:1s}
      read-timeout: ${PLATFORM_IDENTITY_PRODUCT_CLAIMS_READ_TIMEOUT:2s}
  metrics:
    environment: ${PLATFORM_ENVIRONMENT:local}

management:
  server:
    port: ${PLATFORM_CORE_MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "ranikun.db.query.duration": true
      slo:
        "http.server.requests": 20ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s,60s,120s,300s
        "ranikun.db.query.duration": 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
