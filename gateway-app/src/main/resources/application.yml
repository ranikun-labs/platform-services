spring:
  application:
    name: gateway-app
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

server:
  port: ${PLATFORM_GATEWAY_PORT}

platform:
  gateway:
    redis-host: ${PLATFORM_GATEWAY_REDIS_HOST:}
    redis-port: ${PLATFORM_GATEWAY_REDIS_PORT}
    redis-key-prefix: ${PLATFORM_GATEWAY_REDIS_KEY_PREFIX:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
