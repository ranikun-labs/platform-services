name: RPL-51 Identity migrator fail-closed candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/rpl51-identity-failclosed-hosted.yml
      - platform-core/identity/**
      - platform-core/build.gradle.kts
      - platform-core/gradle/**
      - platform-core/settings.gradle.kts
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradlew

permissions:
  contents: read

jobs:
  identity-failclosed:
    if: github.event.pull_request.head.ref == 'codex/rpl54-prod-migrator-failclosed-20261105' || github.event.pull_request.head.ref == 'rpl51-journal-lifecycle-integration-20261111'
    name: Fail-closed configuration and PostgreSQL privilege tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Assert checkout matches exact pull request head SHA
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'SOURCE_SHA=%s\n' "$actual"

      - name: Report hosted Docker API
        run: docker version --format 'Server={{.Server.Version}} API={{.Server.APIVersion}} Minimum={{.Server.MinAPIVersion}}'

      - name: Apply isolated Docker API 1.44 compatibility for Testcontainers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-core/identity/src/test/resources
          printf 'api.version=1.44\n' > platform-core/identity/src/test/resources/docker-java.properties
          grep -qx 'api.version=1.44' platform-core/identity/src/test/resources/docker-java.properties

      - name: Run fail-closed configuration and PostgreSQL privilege tests
        run: >-
          ./gradlew -p platform-core :identity:test --no-daemon
          --tests com.ranikunlabs.platform.identity.adapter.persistence.IdentityFlywayDatasourceConfigurationTest
          --tests com.ranikunlabs.platform.identity.adapter.persistence.IdentitySchemaPrivilegeIntegrationTest
