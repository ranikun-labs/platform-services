name: Platform services DEV release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      service:
        description: Service to publish or deploy
        type: choice
        required: true
        options:
          - gateway
          - core
      deploy:
        description: Deploy the published digest to DEV (otherwise publish only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    name: Test selected service at dispatch SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      test_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Require main
        if: github.repository != 'ranikun-labs/platform-services' || github.ref != 'refs/heads/main'
        run: |
          echo 'DEV releases must be dispatched from main.' >&2
          exit 1
      - name: Check out dispatch SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ inputs.service == 'gateway' && '17' || '21' }}
      - name: Configure Testcontainers API version
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          if [ "$SERVICE" = gateway ]; then
            mkdir -p gateway-app/src/test/resources
            printf 'api.version=1.44\n' > gateway-app/src/test/resources/docker-java.properties
          else
            for module in app identity; do
              mkdir -p "platform-core/$module/src/test/resources"
              printf 'api.version=1.44\n' > "platform-core/$module/src/test/resources/docker-java.properties"
            done
          fi
      - name: Test Gateway
        if: inputs.service == 'gateway'
        run: ./gradlew -p gateway-app test --no-daemon --stacktrace --console=plain
      - name: Test Core
        if: inputs.service == 'core'
        run: ./gradlew -p platform-core test --no-daemon --stacktrace --console=plain
      - name: Record tested SHA
        id: verified
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@4cf8bfedd7454be3a314b22a165d2555fc096fe2
    with:
      service: ${{ inputs.service }}
      dockerfile: ${{ inputs.service == 'gateway' && 'gateway-app/Dockerfile' || 'platform-core/app/Dockerfile' }}
      context: ${{ inputs.service == 'gateway' && 'gateway-app' || 'platform-core' }}
      deploy_enabled: ${{ inputs.deploy }}
      test_sha: ${{ needs.test.outputs.test_sha }}

  # Protect this environment and restrict it to dev before enabling either variable.
  # DEV_PUSH_PUBLISH_ENABLED=true enables publish; DEV_PUSH_DEPLOY_ENABLED=true also enables deploy.
  select-push:
    if: github.event_name == 'push' && github.repository == 'ranikun-labs/platform-services' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev-push-release-control
    outputs:
      services: ${{ steps.select.outputs.services }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed services
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          PUBLISH_ENABLED: ${{ vars.DEV_PUSH_PUBLISH_ENABLED }}
          DEPLOY_ENABLED: ${{ vars.DEV_PUSH_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          services=()
          if [[ "$PUBLISH_ENABLED" == true ]]; then
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              services=(gateway core)
            else
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "$BEFORE^{commit}"
              git diff --name-only --no-renames -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
              gateway=false core=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  gateway-app/*) gateway=true ;;
                  platform-core/*) core=true ;;
                  .github/workflows/dev-ecs-release.yml|gradlew|gradlew.bat|gradle/*|build.gradle.kts|settings.gradle.kts) gateway=true; core=true ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
              [[ "$gateway" != true ]] || services+=(gateway)
              [[ "$core" != true ]] || services+=(core)
            fi
          fi
          if ((${#services[@]})); then
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          else
            json='[]'
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          [[ "$DEPLOY_ENABLED" == true ]] && deploy=true || deploy=false
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test-push-gateway:
    needs: select-push
    if: contains(fromJSON(needs.select-push.outputs.services), 'gateway')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ 'gateway' == 'gateway' && '17' || '21' }}
      - name: Configure Testcontainers API version
        env:
          SERVICE: gateway
        run: |
          if [ "$SERVICE" = gateway ]; then
            mkdir -p gateway-app/src/test/resources
            printf 'api.version=1.44\n' > gateway-app/src/test/resources/docker-java.properties
          else
            for module in app identity; do
              mkdir -p "platform-core/$module/src/test/resources"
              printf 'api.version=1.44\n' > "platform-core/$module/src/test/resources/docker-java.properties"
            done
          fi
      - name: Test selected service
        env:
          SERVICE: gateway
        run: |
          set -euo pipefail
          if [[ "$SERVICE" == gateway ]]; then
            ./gradlew -p gateway-app test --no-daemon --stacktrace --console=plain
          else
            ./gradlew -p platform-core test --no-daemon --stacktrace --console=plain
          fi

  release-push-gateway:
    needs: [select-push, test-push-gateway]
    if: needs.test-push-gateway.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@4cf8bfedd7454be3a314b22a165d2555fc096fe2
    with:
      service: gateway
      dockerfile: ${{ 'gateway' == 'gateway' && 'gateway-app/Dockerfile' || 'platform-core/app/Dockerfile' }}
      context: ${{ 'gateway' == 'gateway' && 'gateway-app' || 'platform-core' }}
      deploy_enabled: ${{ needs.select-push.outputs.deploy == 'true' }}
      test_sha: ${{ github.sha }}
      require_current_dev_tip: true
  test-push-core:
    needs: select-push
    if: contains(fromJSON(needs.select-push.outputs.services), 'core')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ 'core' == 'gateway' && '17' || '21' }}
      - name: Configure Testcontainers API version
        env:
          SERVICE: core
        run: |
          if [ "$SERVICE" = gateway ]; then
            mkdir -p gateway-app/src/test/resources
            printf 'api.version=1.44\n' > gateway-app/src/test/resources/docker-java.properties
          else
            for module in app identity; do
              mkdir -p "platform-core/$module/src/test/resources"
              printf 'api.version=1.44\n' > "platform-core/$module/src/test/resources/docker-java.properties"
            done
          fi
      - name: Test selected service
        env:
          SERVICE: core
        run: |
          set -euo pipefail
          if [[ "$SERVICE" == gateway ]]; then
            ./gradlew -p gateway-app test --no-daemon --stacktrace --console=plain
          else
            ./gradlew -p platform-core test --no-daemon --stacktrace --console=plain
          fi

  release-push-core:
    needs: [select-push, test-push-core]
    if: needs.test-push-core.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@4cf8bfedd7454be3a314b22a165d2555fc096fe2
    with:
      service: core
      dockerfile: ${{ 'core' == 'gateway' && 'gateway-app/Dockerfile' || 'platform-core/app/Dockerfile' }}
      context: ${{ 'core' == 'gateway' && 'gateway-app' || 'platform-core' }}
      deploy_enabled: ${{ needs.select-push.outputs.deploy == 'true' }}
      test_sha: ${{ github.sha }}
      require_current_dev_tip: true
