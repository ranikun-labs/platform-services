name: RPL-127 Finance to Shared AI HTTP Integration

on:
  push:
    branches:
      - closeout/shared-ai-integration-20261110

permissions:
  contents: read

jobs:
  finance-shared-ai-http:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: disposable-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_test -d platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout pinned Platform recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify pinned Platform source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          integration_parent="638b96004d29a7b9a902573e6534f55be8296734"
          test "$(git rev-parse HEAD^)" = "$integration_parent"
          test "$(git rev-parse "$integration_parent^{tree}")" = "bbe6778c3786490674063aa7cfce782a329863b1"
          git merge-base --is-ancestor "376d7e3678976cbd3707ce01818315b9643ef44b" HEAD
          git merge-base --is-ancestor "31f68b5437bee8de889b9e704db0a35d57045ffd" HEAD
          changed_paths="$(git diff --name-only "$integration_parent" HEAD)"
          test "$changed_paths" = ".github/workflows/rpl127-finance-shared-ai-http-integration.yml"

      - name: Download and verify pinned Finance source snapshot
        shell: bash
        run: |
          set -euo pipefail
          finance_source_sha="d8fae6be7b497cf5afbe153a06bb19214d67ec35"
          archive="$RUNNER_TEMP/finance-source.zip"
          unpack="$RUNNER_TEMP/finance-source"
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/ranikun-labs/finance-harness-be/zip/$finance_source_sha" \
            -o "$archive"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          finance_dir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$finance_dir"
          chmod +x "$finance_dir/gradlew"
          git -C "$finance_dir" init -q
          git -C "$finance_dir" add -f -A
          finance_tree="$(git -C "$finance_dir" write-tree)"
          test "$finance_tree" = "e04a728c0380ec21fc9ae441e1aed0c77e30f9b6"
          echo "FINANCE_SOURCE_DIR=$finance_dir" >> "$GITHUB_ENV"
          echo "FINANCE_SOURCE_SHA=$finance_source_sha"
          echo "FINANCE_SOURCE_TREE=$finance_tree"

      - name: Run Shared AI native module tests
        run: >-
          ./gradlew -p platform-core :shared-ai:test --no-daemon --stacktrace --console=plain

      - name: Run Shared AI HTTP contract and production guard tests
        run: >-
          ./gradlew -p platform-core :app:test --no-daemon --stacktrace --console=plain
          --tests com.ranikunlabs.platform.core.SharedAiHttpV1ContractIntegrationTest
          --tests com.ranikunlabs.platform.core.LocalTestSharedAiExecutionControllerActivationTest

      - name: Prepare disposable Identity schema
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U integration_test -d platform \
            -c 'CREATE SCHEMA IF NOT EXISTS identity AUTHORIZATION integration_test;'

      - name: Run Shared AI and Finance as separate JVMs
        shell: bash
        env:
          PLATFORM_CORE_PORT: '18080'
          PLATFORM_CORE_MANAGEMENT_PORT: '18081'
          PLATFORM_IDENTITY_PERSISTENCE_ENABLED: 'true'
          PLATFORM_IDENTITY_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/platform
          PLATFORM_IDENTITY_DATASOURCE_USERNAME: integration_test
          PLATFORM_IDENTITY_DATASOURCE_PASSWORD: disposable-integration-only
          PLATFORM_IDENTITY_REDIS_HOST: '127.0.0.1'
          PLATFORM_IDENTITY_REDIS_PORT: '6379'
          PLATFORM_IDENTITY_REDIS_KEY_PREFIX: 'rpl-http-integration:'
          PLATFORM_IDENTITY_AUTH_ENABLED: 'false'
          SHARED_AI_FOUNDATION_ENABLED: 'true'
          SHARED_AI_SPRING_AI_ENABLED: 'false'
          PLATFORM_SHARED_AI_HTTP_LOCAL_TEST_ENABLED: 'true'
          SPRING_PROFILES_ACTIVE: test
          FINANCE_SHARED_AI_TEST_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          setsid ./gradlew -p platform-core :app:bootRun --no-daemon --stacktrace --console=plain \
            --args='--spring.profiles.active=test' > "$RUNNER_TEMP/shared-ai-app.log" 2>&1 &
          platform_pid=$!
          cleanup() {
            kill -- "-$platform_pid" 2>/dev/null || kill "$platform_pid" 2>/dev/null || true
            wait "$platform_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/actuator/health/readiness >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$platform_pid" 2>/dev/null; then
              echo "Shared AI process exited before readiness."
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Shared AI process did not become ready."
            exit 1
          fi
          cd "$FINANCE_SOURCE_DIR"
          ./gradlew test --no-daemon --stacktrace --console=plain \
            --tests labs.ranikun.finance.generalanalysis.adapter.FinanceSharedAiHttpLiveIntegrationTest \
            --tests labs.ranikun.finance.generalanalysis.adapter.FinanceSharedAiHttpLiveFailureIntegrationTests
