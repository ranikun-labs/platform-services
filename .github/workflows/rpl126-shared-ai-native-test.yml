name: RPL-126 Shared AI Native Test

on:
  push:
    branches:
      - codex/rpl126-shared-ai-test-rebuilt

permissions:
  contents: read

jobs:
  shared-ai-native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fixed Shared AI source
        uses: actions/checkout@v4
        with:
          ref: 2aa4fb0ea3456bc340544da1bef729b5de738780
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify fixed source SHA
        run: test "$(git rev-parse HEAD)" = 2aa4fb0ea3456bc340544da1bef729b5de738780

      - name: Run Shared AI native tests
        run: ./gradlew -p platform-core :shared-ai:test --no-daemon --stacktrace
