name: RPL-126 Shared AI Native Test

on:
  push:
    branches:
      - codex/rpl126-finance-consumer
      - recovery/f4-rpl126

permissions:
  contents: read

jobs:
  shared-ai-native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify checked out source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run Shared AI native tests
        run: ./gradlew -p platform-core :shared-ai:test --no-daemon --stacktrace --console=plain
