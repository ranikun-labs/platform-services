name: RPL-51 Finance trusted-context current-main integration

on:
  push:
    branches:
      - closeout/platform47-on-main-local
    paths:
      - .github/workflows/rpl51-finance-context-main-integration.yml

permissions:
  contents: read

jobs:
  gateway-targeted:
    name: Gateway trusted-context targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the pushed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify fixed integration source and workflow-only commit
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          EXPECTED_INTEGRATION_PARENT: c1b4d74a1e0bb922811fbb36bc60152920dd5495
          EXPECTED_INTEGRATION_TREE: 7f1b590764a19dd86d6d8906b748c48668bce00c
          EXPECTED_MAIN: 8cb671a3153ad5111b89f20bf981b82e0030318f
          EXPECTED_PR47: 72a6b343b9972f5fb4304d913e9537a551af8530
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_INTEGRATION_PARENT"
          test "$(git rev-parse "${EXPECTED_INTEGRATION_PARENT}^{tree}")" = "$EXPECTED_INTEGRATION_TREE"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          git merge-base --is-ancestor "$EXPECTED_PR47" HEAD
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = ".github/workflows/rpl51-finance-context-main-integration.yml"
          printf 'SOURCE_SHA=%s\nINTEGRATION_PARENT=%s\nINTEGRATION_TREE=%s\n' \
            "$(git rev-parse HEAD)" "$EXPECTED_INTEGRATION_PARENT" "$EXPECTED_INTEGRATION_TREE"

      - name: Run focused Gateway integration tests
        shell: bash
        run: >-
          ./gradlew -p gateway-app test --no-daemon
          --tests com.ranikunlabs.platform.gateway.filter.FinanceTrustedContextGatewayFilterTest
          --tests com.ranikunlabs.platform.gateway.route.GatewayRoutingHttpIntegrationTest
          --tests com.ranikunlabs.platform.gateway.filter.JwtGlobalFilterCharacterizationTest
