name: Temporary RPL-127 Finance to Shared AI HTTP Integration

on:
  push:
    branches:
      - recovery/f4-rpl126

permissions:
  contents: read

jobs:
  finance-shared-ai-http:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: disposable-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_test -d platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout pinned Platform recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Platform source commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "34b5cca164b0acdb364dfb58c6648a9e400c3a47" HEAD
          changed_paths="$(git diff --name-only 34b5cca164b0acdb364dfb58c6648a9e400c3a47 HEAD)"
          test "$changed_paths" = ".github/workflows/f4-rpl127-finance-shared-ai-http-temporary.yml"
      - name: Download and verify public Finance recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/finance-source.zip"
          unpack="$RUNNER_TEMP/finance-source"
          curl --fail --silent --show-error --location "https://codeload.github.com/ranikun-labs/finance-harness-be/zip/0bcb50fb601ca7998134f876f99d2fe52308bad1" -o "$archive"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          finance_dir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$finance_dir"
          chmod +x "$finance_dir/gradlew"
          git -C "$finance_dir" init -q
          git -C "$finance_dir" add -f -A
          finance_tree="$(git -C "$finance_dir" write-tree)"
          test "$finance_tree" = "47973a0571751c223c6ec57e115100bb07efd154"
          test_path="$finance_dir/src/test/kotlin/labs/ranikun/finance/generalanalysis/adapter/FinanceSharedAiHttpLiveIntegrationTest.kt"
          mkdir -p "$(dirname "$test_path")"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/ranikun-labs/finance-harness-be/5cd1b160755a6e2800111df4cf3e8f967e3ac50b/src/test/kotlin/labs/ranikun/finance/generalanalysis/adapter/FinanceSharedAiHttpLiveIntegrationTest.kt" -o "$test_path"
          test "$(git -C "$finance_dir" hash-object "$test_path")" = "5accde6c44e5ea41281c8102c75000c40670ef25"
          echo "FINANCE_SOURCE_DIR=$finance_dir" >> "$GITHUB_ENV"
          echo "Pinned Finance source tree verified: $finance_tree"
      - name: Run Shared AI and Finance as separate JVMs
        shell: bash
        env:
          PLATFORM_CORE_PORT: '18080'
          PLATFORM_CORE_MANAGEMENT_PORT: '18081'
          PLATFORM_IDENTITY_PERSISTENCE_ENABLED: 'true'
          PLATFORM_IDENTITY_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/platform
          PLATFORM_IDENTITY_DATASOURCE_USERNAME: integration_test
          PLATFORM_IDENTITY_DATASOURCE_PASSWORD: disposable-integration-only
          PLATFORM_IDENTITY_REDIS_HOST: '127.0.0.1'
          PLATFORM_IDENTITY_REDIS_PORT: '6379'
          PLATFORM_IDENTITY_REDIS_KEY_PREFIX: 'rpl-http-integration:'
          PLATFORM_IDENTITY_AUTH_ENABLED: 'false'
          SHARED_AI_FOUNDATION_ENABLED: 'true'
          SHARED_AI_SPRING_AI_ENABLED: 'false'
          PLATFORM_SHARED_AI_HTTP_LOCAL_TEST_ENABLED: 'true'
          SPRING_PROFILES_ACTIVE: test
          FINANCE_SHARED_AI_TEST_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          diagnose_startup() {
            log="$RUNNER_TEMP/shared-ai-app.log"
            if [ ! -r "$log" ]; then
              echo "STARTUP_DIAGNOSTIC=LOG_UNAVAILABLE"
              return
            fi
            if grep -Fq "BUILD SUCCESSFUL" "$log"; then
              echo "GRADLE_BUILD=SUCCESS"
            elif grep -Eq "BUILD FAILED|FAILURE: Build failed" "$log"; then
              echo "GRADLE_BUILD=FAILED"
            else
              echo "GRADLE_BUILD=NO_TERMINAL_MARKER"
            fi
            if grep -Eq "Started [A-Za-z0-9_$.]+ in [0-9.]+ seconds" "$log"; then
              echo "SPRING_CONTEXT_STARTED=YES"
            else
              echo "SPRING_CONTEXT_STARTED=NO"
            fi
            cause_types="$(awk -F'Caused by: ' 'NF > 1 { split($2, part, ":"); print part[1] }' "$log" | tail -5 | paste -sd, -)"
            if [ -n "$cause_types" ]; then
              echo "ROOT_CAUSE_TYPES=$cause_types"
            fi
            exception_types="$(grep -Eo '[A-Za-z0-9_$.]*(Exception|Error)' "$log" | sort -u | paste -sd, - || true)"
            if [ -n "$exception_types" ]; then
              echo "EXCEPTION_TYPES=$exception_types"
            fi
            if grep -Fq "Execution failed for task ':app:bootRun'" "$log"; then
              echo "FAILED_TASK=APP_BOOTRUN"
            elif grep -Fq "Execution failed for task" "$log"; then
              echo "FAILED_TASK=OTHER_GRADLE_TASK"
            fi
            if grep -Fq "Could not start process" "$log"; then
              echo "STARTUP_CATEGORY=PROCESS_START_FAILED"
            elif grep -Fq "Could not resolve" "$log"; then
              echo "STARTUP_CATEGORY=DEPENDENCY_RESOLUTION_FAILED"
            elif grep -Fq "Failed to bind properties" "$log"; then
              echo "STARTUP_CATEGORY=CONFIGURATION_BIND_FAILED"
            elif grep -Fq "Application run failed" "$log"; then
              echo "STARTUP_CATEGORY=SPRING_RUNTIME_FAILED"
            fi
            if grep -Fq "APPLICATION FAILED TO START" "$log"; then
              echo "STARTUP_CATEGORY=SPRING_APP_STARTUP_FAILED"
            elif grep -Fq "Failed to configure a DataSource" "$log"; then
              echo "STARTUP_CATEGORY=DATA_SOURCE_CONFIGURATION_FAILED"
            elif grep -Fq "Connection refused" "$log"; then
              echo "STARTUP_CATEGORY=CONNECTION_REFUSED"
            elif grep -Fq "Address already in use" "$log"; then
              echo "STARTUP_CATEGORY=PORT_BIND_FAILED"
            elif grep -Fq "No qualifying bean" "$log"; then
              echo "STARTUP_CATEGORY=MISSING_SPRING_BEAN"
            elif grep -Fq "Flyway" "$log"; then
              echo "STARTUP_CATEGORY=FLYWAY_ERROR"
            elif grep -Fq "Liquibase" "$log"; then
              echo "STARTUP_CATEGORY=LIQUIBASE_ERROR"
            else
              echo "STARTUP_CATEGORY=UNCLASSIFIED"
            fi
          }
          setsid ./gradlew -p platform-core :app:bootRun --no-daemon --stacktrace --console=plain --args='--spring.profiles.active=test' > "$RUNNER_TEMP/shared-ai-app.log" 2>&1 &
          platform_pid=$!
          cleanup() {
            kill -- "-$platform_pid" 2>/dev/null || kill "$platform_pid" 2>/dev/null || true
            wait "$platform_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/actuator/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$platform_pid" 2>/dev/null; then
              echo "Shared AI test process exited before readiness."
              diagnose_startup
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Shared AI test process did not become ready."
            diagnose_startup
            exit 1
          fi
          cd "$FINANCE_SOURCE_DIR"
          ./gradlew test --no-daemon --stacktrace --console=plain --tests labs.ranikun.finance.generalanalysis.adapter.FinanceSharedAiHttpLiveIntegrationTest
